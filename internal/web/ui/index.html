<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>SessionKeep</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell" id="shell">
  <header class="topbar">
    <button type="button" id="menu" class="menu" aria-expanded="false" aria-controls="side">Menu</button>
    <strong>SessionKeep</strong>
  </header>
  <aside class="side" id="side">
    <div class="brand">
      <svg class="logo" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect class="logo-bg" x="1" y="1" width="24" height="24" rx="7"></rect><path class="logo-a" d="M7 9c3 0 3 8 6 8s3-8 6-8"></path><path class="logo-b" d="M7 17c3 0 3-8 6-8s3 8 6 8"></path></svg>
      <p><strong>SessionKeep</strong><span>Stays on this computer</span></p>
    </div>
    <div id="sidetop"></div>
    <nav aria-label="Sections">
      <p class="navhead" id="navhead">Everything</p>
      <ul id="nav"></ul>
    </nav>
    <div id="sideprojects"></div>
    <div class="sidefoot">
      <p class="savechip"><span id="saving">Loading</span><span id="version"></span></p>
      <button type="button" id="theme" class="themebtn">Switch to dark theme</button>
      <p id="foot" class="railfoot">Nothing on this page leaves your computer.</p>
    </div>
  </aside>
  <main id="main" tabindex="-1">
    <header class="pagehead">
      <div>
        <p id="crumb" class="crumb"></p>
        <div class="titlerow"><h1 id="title">SessionKeep</h1><span id="scopetag" class="scopetag"></span></div>
        <p id="lede" class="lede"></p>
      </div>
      <div id="actions" class="actions"></div>
    </header>
    <p id="notice" role="status" aria-live="polite"></p>
    <div id="view"></div>
  </main>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog>
<template id="icons">
  <svg data-icon="overview" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1.5"></rect><rect x="9" y="2" width="5" height="5" rx="1.5"></rect><rect x="2" y="9" width="12" height="5" rx="1.5"></rect></svg>
  <svg data-icon="projects" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5a1 1 0 011-1h3l1.5 1.5H13a1 1 0 011 1V12a1 1 0 01-1 1H3a1 1 0 01-1-1z"></path></svg>
  <svg data-icon="search" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5l3 3"></path></svg>
  <svg data-icon="instructions" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3h10v10H3zM5.5 6h5M5.5 8.5h5M5.5 11h3"></path></svg>
  <svg data-icon="settings" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2"></circle><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M3.6 12.4L5 11M11 5l1.4-1.4"></path></svg>
  <svg data-icon="health" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8.5h3l1.5-4 3 8 1.5-4h4"></path></svg>
  <svg data-icon="resume" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5h10v11l-5-3-5 3z"></path></svg>
  <svg data-icon="recap" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3" width="11" height="10.5" rx="1.5"></rect><path d="M2.5 6.5h11M5.5 1.8v2.4M10.5 1.8v2.4"></path></svg>
  <svg data-icon="sessions" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h7"></path></svg>
  <svg data-icon="research" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"></circle><path d="M2.5 8h11M8 2.5c2 2 2 9 0 11M8 2.5c-2 2-2 9 0 11"></path></svg>
  <svg data-icon="sharing" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 12.5h7a3 3 0 00.4-6 4 4 0 00-7.6-.8A3.4 3.4 0 004.5 12.5z"></path></svg>
  <svg data-icon="back" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5"></path></svg>
  <svg data-icon="folder" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5a1 1 0 011-1h3l1.5 1.5H13a1 1 0 011 1V12a1 1 0 01-1 1H3a1 1 0 01-1-1z"></path></svg>
</template>

<script type="module" src="/app.js"></script>
</body>
</html>
