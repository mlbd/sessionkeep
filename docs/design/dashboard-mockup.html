<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SessionKeep dashboard: redesign mockup</title>
<!--
  A clickable mockup of a simpler SessionKeep dashboard. Sample data only; it is not connected
  to the program and nothing here changes anything. Two levels:
    1. Everything (no project chosen): the project list and what applies to every project.
    2. Inside a project: its own menu on the left, and every page there is about that project only.
-->
<style>
  :root {
    --bg: #f4f3ef; --surface: #ffffff; --ink: #1d2320; --muted: #66706b; --line: #e3e1da; --line2: #d4d1c8;
    --accent: #1f6f5c; --accent-soft: #e4f1ec; --accent-ink: #ffffff;
    --all: #2f5f9e; --all-soft: #e6eef9; --proj: #1f6f5c; --proj-soft: #e4f1ec;
    --warn: #9a6400; --warn-soft: #fbf0d9; --bad: #a33a2b; --bad-soft: #f9e5e1; --ok: #2a7a4b; --ok-soft: #e3f3e8;
    --side: #ebe9e3; --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
  a { color: inherit; }
  button { font: inherit; cursor: pointer; }
  .app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }

  /* Sidebar */
  .side { background: var(--side); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 2px 8px 6px; font-weight: 700; font-size: 15px; }
  .brand i { width: 22px; height: 22px; border-radius: 7px; background: var(--accent); display: inline-block; }
  .side h3 { margin: 6px 8px 2px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; text-decoration: none; color: #2d3530; }
  .nav a:hover { background: rgba(0,0,0,.05); }
  .nav a.on { background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.06); font-weight: 600; }
  .nav a .n { margin-left: auto; font-size: 11.5px; color: var(--muted); }
  .nav svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; opacity: .8; }
  .back { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 9px; text-decoration: none; color: var(--muted); font-size: 13px; }
  .back:hover { background: rgba(0,0,0,.05); color: var(--ink); }
  .projhead { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .projhead b { display: block; font-size: 15px; }
  .projhead .path { font: 11.5px var(--mono); color: var(--muted); word-break: break-all; }
  .projhead .row { margin-top: 8px; }
  .sidefoot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 0 8px; }

  /* Main */
  main { padding: 26px 34px 60px; max-width: 1080px; }
  .crumb { font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  .crumb a { text-decoration: none; } .crumb a:hover { text-decoration: underline; }
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
  h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: -.01em; }
  .lede { margin: 0; color: var(--muted); max-width: 640px; }
  .scope { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
  .scope.all { background: var(--all-soft); color: var(--all); }
  .scope.proj { background: var(--proj-soft); color: var(--proj); }
  .scope svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.7; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
  .card + .card, .stack > * + * { margin-top: 14px; }
  .card h2 { margin: 0 0 4px; font-size: 16px; }
  .card h4 { margin: 14px 0 6px; font-size: 13px; }
  .hint { color: var(--muted); font-size: 12.5px; margin: 2px 0 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .grid2 > .card, .grid3 > .card { margin-top: 0; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .muted { color: var(--muted); } .small { font-size: 12.5px; }
  .mono { font-family: var(--mono); font-size: 12.5px; }

  .btn { background: var(--surface); border: 1px solid var(--line2); border-radius: 9px; padding: 7px 13px; font-size: 13px; color: var(--ink); }
  .btn:hover { border-color: #b9b5aa; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.danger { color: var(--bad); border-color: #e2b8b0; }
  .btn.link { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; }

  .pill { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; display: inline-block; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.grey { background: #ecebe6; color: var(--muted); }
  .pill.share { background: var(--all-soft); color: var(--all); }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr.click { cursor: pointer; } tr.click:hover td { background: #faf9f6; }
  tr:last-child td { border-bottom: 0; }

  label { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; margin-top: 12px; }
  input[type=text], input[type=password], select, textarea { font: inherit; font-weight: 400; padding: 8px 10px; border: 1px solid var(--line2); border-radius: 9px; background: #fff; width: 100%; }
  textarea { min-height: 70px; resize: vertical; }
  .tiles { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .tile { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; padding: 10px 12px; border: 1px solid var(--line2); border-radius: 10px; font-weight: 400; margin: 0; cursor: pointer; }
  .tile b { font-size: 13px; } .tile span { grid-column: 2; font-size: 12px; color: var(--muted); }
  .tile:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .tile:has(input:disabled) { opacity: .5; cursor: default; }
  .seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 9px; overflow: hidden; background: #fff; }
  .seg button { border: 0; background: none; padding: 6px 12px; font-size: 12.5px; color: var(--muted); }
  .seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .reveal { display: flex; gap: 8px; } .reveal input { flex: 1; }
  .switch { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
  .switch i { width: 34px; height: 20px; border-radius: 99px; background: #cfccc3; position: relative; display: inline-block; }
  .switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch.on i { background: var(--accent); } .switch.on i::after { left: 17px; }

  .note { background: var(--all-soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: #24456f; }
  .warnbox { background: var(--warn-soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: #6b4600; }
  .stat b { display: block; font-size: 22px; } .stat span { color: var(--muted); font-size: 12.5px; }
  .parts { display: grid; grid-template-columns: 90px 1fr; gap: 6px 12px; font-size: 13.5px; margin-top: 8px; }
  .parts dt { color: var(--muted); font-weight: 600; } .parts dd { margin: 0; }
  .turn { padding: 10px 12px; border-radius: 10px; background: #faf9f6; border: 1px solid var(--line); margin-top: 8px; font-size: 13.5px; }
  .turn b { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display: block; margin-bottom: 2px; }
  .quote { font-family: var(--mono); font-size: 13px; background: #f6f5f1; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .danger-zone { border-color: #ecc9c2; }
  .demo { position: fixed; right: 14px; bottom: 14px; background: #1d2320; color: #fff; font-size: 12px; padding: 8px 12px; border-radius: 10px; opacity: .85; }
  .tabsline { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .tabsline button { border: 0; background: none; padding: 8px 12px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabsline button.on { color: var(--ink); font-weight: 600; border-color: var(--accent); }
  .empty { text-align: center; padding: 30px; color: var(--muted); }

  /* ---- Theme: cool canvas, graphite sidebar, Bahnschrift for headings and figures ---- */
  :root {
    --bg: #f3f5f8; --surface: #ffffff; --ink: #141922; --muted: #5d6675; --line: #e1e5eb; --line2: #cfd5de;
    --accent: #0f7b65; --accent-soft: #e2f2ed; --accent-ink: #ffffff;
    --all: #2c5ea8; --all-soft: #e5edf9; --proj: #0f7b65; --proj-soft: #e2f2ed;
    --warn: #b5761a; --warn-soft: #fbf1df; --ok: #1f7a4d; --ok-soft: #e2f3e9;
    --side: #141920; --side-ink: #c4cad4; --side-mute: #7b8492; --side-on: #222a35;
    --display: Bahnschrift, "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  }
  body { font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; font-size: 14px; }
  h1, h2, .figure { font-family: var(--display); font-weight: 600; letter-spacing: 0; }
  h1 { font-size: 26px; }
  .card { border-radius: 12px; box-shadow: none; }

  .side { background: var(--side); border-right: 0; color: var(--side-ink); }
  .brand { color: #fff; }
  .brand i { background: linear-gradient(135deg, #12a383, #0f7b65); }
  .side h3 { text-transform: none; letter-spacing: 0; font-size: 12px; color: var(--side-mute); font-weight: 500; }
  .nav a { color: var(--side-ink); position: relative; }
  .nav a:hover { background: rgba(255,255,255,.05); color: #fff; }
  .nav a.on { background: var(--side-on); color: #fff; box-shadow: none; }
  .nav a.on::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: #12a383; }
  .nav a .n { color: var(--side-mute); }
  .side .pill.ok { background: rgba(18,163,131,.16); color: #5fd3b4; }
  .side .pill.warn { background: rgba(229,166,60,.16); color: #f0bf6a; }
  .side .pill.grey { background: rgba(255,255,255,.08); color: var(--side-mute); }
  .side .pill.share { background: rgba(80,140,230,.18); color: #93b8f0; }
  .back { color: var(--side-mute); } .back:hover { background: rgba(255,255,255,.05); color: #fff; }
  .projhead { background: var(--side-on); border-color: #2c3543; color: #fff; }
  .projhead .path { color: var(--side-mute); }
  .sidefoot { color: var(--side-mute); }

  th { text-transform: none; letter-spacing: 0; font-size: 12px; }
  .turn b { text-transform: none; letter-spacing: 0; font-size: 12px; font-weight: 600; }
  .demo { background: var(--side); }

  /* ---- Overview ---- */
  .status-line { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: -6px 0 18px; font-size: 13px; color: var(--muted); }
  .status-line span { display: inline-flex; align-items: center; gap: 7px; }
  .status-line b { color: var(--ink); font-family: var(--display); font-weight: 600; font-size: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
  .dot.live { background: #12a383; box-shadow: 0 0 0 4px rgba(18,163,131,.18); }

  .continue { display: grid; grid-template-columns: 1fr auto; gap: 18px 28px; align-items: end; padding: 24px 26px; border-radius: 16px;
    background: linear-gradient(120deg, #10261f 0%, #123a30 55%, #0f4a3b 100%); color: #e9f4f0; border: 0; }
  .continue .where { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #a9cfc3; }
  .continue .where b { color: #fff; font-weight: 600; }
  .continue h2 { font-size: 28px; line-height: 1.15; margin: 10px 0 14px; color: #fff; max-width: 22ch; }
  .continue .steps { display: flex; flex-wrap: wrap; gap: 8px 26px; font-size: 13.5px; color: #cfe5de; }
  .continue .steps em { font-style: normal; color: #8dbdaf; margin-right: 6px; }
  .continue .acts { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
  .continue .btn { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.18); color: #fff; text-align: center; text-decoration: none; }
  .continue .btn.primary { background: #fff; border-color: #fff; color: #0f4a3b; }

  .week { margin-top: 14px; }
  .week .grid { display: grid; grid-template-columns: 150px repeat(7, 1fr); align-items: center; }
  .week .day { font-size: 12px; color: var(--muted); padding: 0 6px 8px; }
  .week .day.today { color: var(--accent); font-weight: 600; }
  .week .name { font-size: 13px; font-weight: 600; padding: 9px 0; border-top: 1px solid var(--line); text-decoration: none; }
  .week .name:hover { color: var(--accent); }
  .week .cell { display: flex; gap: 3px; padding: 9px 6px; border-top: 1px solid var(--line); min-height: 38px; align-items: center; }
  .week .cell.today { background: linear-gradient(var(--accent-soft), var(--accent-soft)) padding-box; }
  .week .s { height: 16px; border-radius: 4px; background: var(--accent); }
  .week .s.short { width: 8px; opacity: .55; } .week .s.mid { width: 16px; opacity: .8; } .week .s.long { width: 26px; }
  .week .s.paused { background: var(--line2); }
  .week .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); align-items: center; }
  .week .legend i { display: inline-block; height: 10px; border-radius: 3px; background: var(--accent); margin-right: 6px; vertical-align: -1px; }

  .needs { list-style: none; margin: 8px 0 0; padding: 0; }
  .needs li { display: grid; grid-template-columns: 4px 1fr auto; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
  .needs li:first-child { border-top: 0; }
  .needs .bar { align-self: stretch; border-radius: 4px; background: var(--warn); }
  .needs .bar.share { background: var(--all); }
  .needs p { margin: 0; font-size: 13.5px; } .needs p span { display: block; font-size: 12px; color: var(--muted); }

  .latest { list-style: none; margin: 8px 0 0; padding: 0; }
  .latest li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .latest li:first-child { border-top: 0; }
  .latest .t { font-size: 13.5px; font-weight: 500; }
  .latest .p { font-size: 12px; color: var(--muted); }
  .latest .w { grid-row: 1 / 3; grid-column: 2; font-size: 12px; color: var(--muted); align-self: center; text-align: right; }
  .latest .live { color: #0f7b65; font-weight: 600; }
  .seeall { font-size: 13px; color: var(--accent); font-weight: 600; text-decoration: none; }

  :focus-visible { outline: 2px solid #12a383; outline-offset: 2px; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; } .side { position: static; height: auto; }
    .grid2, .grid3 { grid-template-columns: 1fr; } .continue { grid-template-columns: 1fr; }
    .week .grid { grid-template-columns: 96px repeat(7, 1fr); } main { padding: 20px 16px 60px; }
  }

  /* ---- Folder picker ---- */
  dialog.picker { width: min(720px, calc(100% - 32px)); padding: 0; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 24px 70px rgba(20,25,34,.28); color: var(--ink); }
  dialog.picker::backdrop { background: rgba(20,25,34,.45); }
  .pk-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .pk-head h2 { margin: 0; font-size: 17px; }
  .pk-os { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .pk-body { display: grid; grid-template-columns: 170px 1fr; min-height: 340px; }
  .pk-places { border-right: 1px solid var(--line); padding: 10px 8px; background: #f8f9fb; display: flex; flex-direction: column; gap: 2px; }
  .pk-places small { padding: 8px 8px 4px; color: var(--muted); font-size: 12px; }
  .pk-places button { text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 7px; font-size: 13px; color: var(--ink); }
  .pk-places button:hover, .pk-places button.on { background: var(--accent-soft); color: var(--accent); }
  .pk-main { display: flex; flex-direction: column; min-width: 0; }
  .pk-path { display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .pk-path button.crumbbtn { border: 0; background: none; padding: 2px 4px; border-radius: 5px; font: 12.5px var(--mono); color: var(--ink); }
  .pk-path button.crumbbtn:hover { background: #eef1f5; }
  .pk-path .sep { color: var(--line2); }
  .pk-list { list-style: none; margin: 0; padding: 6px; overflow-y: auto; max-height: 300px; flex: 1; }
  .pk-list li button { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 8px 10px; border-radius: 8px; text-align: left; font-size: 13.5px; color: var(--ink); }
  .pk-list li button:hover { background: #f1f4f7; }
  .pk-list svg { width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 1.5; flex: none; }
  .pk-list .tag { margin-left: auto; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
  .pk-list .tag.done { background: #eceff3; color: var(--muted); }
  .pk-empty { padding: 30px; text-align: center; color: var(--muted); font-size: 13px; }
  .pk-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; border-top: 1px solid var(--line); background: #f8f9fb; border-radius: 0 0 14px 14px; }
  .pk-foot .chosen { font: 12.5px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 640px) { .pk-body { grid-template-columns: 1fr; } .pk-places { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
</div>
<div class="demo">Mockup with sample data. Nothing here is saved.</div>
<dialog class="picker" id="picker" aria-labelledby="pk-title">
  <div class="pk-head"><h2 id="pk-title">Choose a project folder</h2>
    <div class="pk-os">Mockup: show it on <div class="seg"><button data-pk-os="windows">Windows</button><button data-pk-os="mac">macOS</button><button data-pk-os="linux">Linux</button></div></div></div>
  <div class="pk-body">
    <nav class="pk-places" id="pk-places" aria-label="Places"></nav>
    <div class="pk-main">
      <div class="pk-path"><button class="btn" data-pk-up aria-label="Go up one folder">Up</button><span id="pk-path" class="row" style="gap:2px"></span></div>
      <ul class="pk-list" id="pk-list"></ul>
    </div>
  </div>
  <div class="pk-foot"><span class="chosen">Selected: <span id="pk-chosen"></span></span>
    <div class="row"><button class="btn" data-pk-cancel>Cancel</button><button class="btn primary" data-pk-pick>Use this folder</button></div></div>
</dialog>


<script>
// ---- Sample data -----------------------------------------------------------------------------
const projects = [
  { id: 'shop-app', name: 'shop-app', path: 'C:\\Code\\shop-app', state: 'saving', level: 'Conversation', last: '25 minutes ago', sessions: 48, shared: { as: 'shop-app', storage: 'Shared storage', bucket: 'company-team' } },
  { id: 'side-notes', name: 'side-notes', path: 'C:\\Code\\side-notes', state: 'saving', level: 'Conversation', last: 'yesterday', sessions: 17, shared: { as: 'side-notes', storage: 'Personal storage', bucket: 'my-bucket' } },
  { id: 'client-site', name: 'client-site', path: 'C:\\Clients\\acme\\site', state: 'paused', level: 'Conversation and tool output', last: '6 days ago', sessions: 22, shared: null },
  { id: 'scratch', name: 'scratch', path: 'C:\\Code\\scratch', state: 'off', level: 'Nothing', last: 'never', sessions: 0, shared: null },
];
const STATE = { saving: ['ok', 'Saving'], paused: ['warn', 'Paused'], off: ['grey', 'Not saving'] };

// ---- Icons -----------------------------------------------------------------------------------
const I = {

function route() {
  const parts = (location.hash.replace(/^#\/?/, '') || 'overview').split('/');
  if (parts[0] === 'p') {
    const p = projects.find(x => x.id === parts[1]) || projects[0];
    return { p, page: parts[2] || 'overview' };
  }
  return { p: null, page: parts[0] };
}

// Small interactive bits: segmented buttons, switches, show/hide.
document.addEventListener('click', e => {
  const s = e.target.closest('.seg button');
  if (s) { s.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === s)); }
  const sw = e.target.closest('.switch');
  if (sw) sw.classList.toggle('on');
  const t = e.target.closest('[data-tab]');
  if (t) {
    const box = t.closest('[data-tabs]');
    box.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b === t));
    box.querySelectorAll('[data-pane]').forEach(x => { x.hidden = x.dataset.pane !== t.dataset.tab; });
  }
  const r = e.target.closest('[data-reveal]');
  if (r) { const i = document.getElementById(r.dataset.reveal); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; r.textContent = show ? 'Hide' : 'Show'; }
  const row = e.target.closest('tr[data-go]');
  if (row) location.hash = row.dataset.go;
  const toggle = e.target.closest('[data-toggle]');
  if (toggle) { const x = document.getElementById(toggle.dataset.toggle); x.hidden = !x.hidden; }
});
document.addEventListener('change', e => {
  if (e.target.name === 'where') document.getElementById('ownbucket').hidden = e.target.value !== 'own';
  if (e.target.name === 'newmode') document.getElementById('autolevel').hidden = e.target.value !== 'auto';
});

  search(p) {

  rules(p) {

      <div class="card" data-tabs>

  research(p) {

  sharing(p) {
    if (p.shared) return header('Sharing', 'This project is shared through the cloud. Nothing is sent or received until you press Sync now.', scopeProj(p), crumbProj(p, 'Sharing')) + `
      <div class="card"><div class="between"><h2>Shared as "${p.shared.as}"</h2><span class="pill share">${p.shared.storage}</span></div>

        <div class="row" style="margin-top:12px"><button class="btn primary">Sync now</button></div>
        <p class="small muted" style="margin-top:8px">Sync shows what would be received and sent first, including any instructions a colleague sent.</p></div>
      <div class="grid2">
        <div class="card"><h2>Passphrase</h2><p class="hint">Forgot it, or a colleague needs it? It can be shown here because this computer is connected.</p>
          <button class="btn" data-toggle="pp">Show passphrase</button>
          <div id="pp" hidden style="margin-top:10px"><div class="warnbox">Anyone who sees it and can reach the bucket can read this project. Make sure nobody else can see your screen.</div>
            <div class="quote" style="margin-top:8px">correct horse battery staple</div><div class="row" style="margin-top:8px"><button class="btn">Copy</button></div></div></div>
        <div class="card"><h2>Stop sharing</h2><p class="hint">This computer forgets the passphrase and stops sending and receiving. Everything saved here stays; what is in the bucket stays.</p>
          <button class="btn danger">Stop sharing</button></div>

    return header('Sharing', 'This project stays on this computer. Share it to exchange its memory with colleagues through a bucket you choose.', scopeProj(p), crumbProj(p, 'Sharing')) + `
      <div class="card"><h2>Share ${p.name} through the cloud</h2>
        <p class="hint">Its instructions, checkpoints and conversations are sent, encrypted on this computer, when you press Sync now.</p>
        <h4>Where it is kept</h4>
        ${tiles('where', [['personal', 'Personal storage', 'Your own bucket my-bucket.'], ['shared', 'Shared storage', 'The bucket company-team you share with others.'], ['own', 'A bucket of its own', 'Another bucket for this project only, such as one a client gave you.']], 'personal')}
        <div id="ownbucket" hidden style="border-left:2px solid var(--line2); padding-left:12px; margin-top:6px">
          <label>Storage address<input type="text" placeholder="https://ACCOUNT_ID.r2.cloudflarestorage.com"></label>
          <label>Bucket name<input type="text"></label>
          <div class="grid2"><label>Access Key ID<input type="password"></label><label>Secret Access Key<input type="password"></label></div></div>
        <label>Shared project name<input type="text" value="${p.id}"><span class="small muted" style="font-weight:400">Colleagues must type exactly the same name.</span></label>
        <label>Passphrase<span class="reveal"><input type="password" id="newpp"><button class="btn" data-reveal="newpp">Show</button></span><span class="small muted" style="font-weight:400">At least 8 characters. Make one up if you are the first; otherwise use the one your colleague gave you.</span></label>

  },
  settings(p) {
    const lv = { 'Conversation': 'conversation', 'Conversation and tool output': 'extended', 'Activity only': 'metadata', 'Nothing': 'off' }[p.level];
    return header('Project settings', `Settings for ${p.name} only.`, scopeProj(p), crumbProj(p, 'Project settings')) + `
      <div class="card"><h2>What is saved</h2>
        ${tiles('lvl', [['conversation', 'Conversation', 'What you ask and what Claude answers. The usual choice.'], ['extended', 'Conversation and tool output', 'Also short excerpts of what tools printed.'], ['metadata', 'Activity only', 'Times and tool names. No text at all.'], ['off', 'Nothing', 'Registered, but nothing is saved.']], lv)}
        <div class="row" style="margin-top:12px"><button class="btn primary">Save</button><button class="btn">${p.state === 'paused' ? 'Resume saving' : 'Pause saving'}</button></div></div>
      <div class="card"><h2>How Claude gets earlier sessions</h2>
        ${tiles('rec', [['asked', 'When asked', 'Claude gets your instructions and the latest checkpoint, and looks into earlier sessions when you refer to them.'], ['automatic', 'Automatically', 'Also: each new session is told what the latest sessions were about, and each request gets the saved pieces that share its words.']], 'asked')}
        <div class="row" style="margin-top:12px"><button class="btn primary">Save</button></div></div>
      <div class="card"><h2>Folder</h2><p class="hint">Renamed or moved the folder? Point the project at the new place so its saved sessions stay with it.</p>
        <div class="mono">${p.path}</div>
        <div class="row" style="margin-top:10px"><input type="text" placeholder="New folder" style="flex:1"><button class="btn">Move project</button></div></div>
      <div class="card danger-zone"><h2>Delete</h2><p class="hint">Both show exactly what would be removed and ask before deleting.</p>

// ---- Folder picker -----------------------------------------------------------------------------
// In the real program the folder names would come from SessionKeep's own local server, which can
// read this computer's folders (a web page cannot see full paths by itself). Here they are made up,
// with a switch to show how the same window looks on Windows, macOS and Linux.
const FS = {
  windows: {
    sep: '\\',
    places: [['Home', 'C:\\Users\\you'], ['Desktop', 'C:\\Users\\you\\Desktop'], ['Documents', 'C:\\Users\\you\\Documents'], ['Drive C:', 'C:\\'], ['Drive D:', 'D:\\']],
    tree: {
      'C:\\': ['Code', 'Clients', 'Program Files', 'Users', 'Windows'],
      'C:\\Code': ['shop-app*', 'side-notes*', 'scratch*', 'api-gateway+', 'website+'],
      'C:\\Clients': ['acme'], 'C:\\Clients\\acme': ['site*', 'mobile-app+'],
      'C:\\Users': ['you'], 'C:\\Users\\you': ['Desktop', 'Documents', 'Downloads', 'Projects'],
      'C:\\Users\\you\\Projects': ['invoice-tool+', 'notes'], 'C:\\Users\\you\\Documents': ['Reports'],
      'D:\\': ['Work', 'Backups'], 'D:\\Work': ['legacy-crm+', 'data-scripts+'],
    },
  },
  mac: {
    sep: '/',
    places: [['Home', '/Users/you'], ['Desktop', '/Users/you/Desktop'], ['Documents', '/Users/you/Documents'], ['Computer', '/'], ['External disk', '/Volumes/Work']],
    tree: {
      '/': ['Applications', 'Users', 'Volumes'], '/Users': ['you'],
      '/Users/you': ['Code', 'Desktop', 'Documents', 'Downloads'],
      '/Users/you/Code': ['shop-app*', 'side-notes*', 'api-gateway+', 'website+'],
      '/Volumes': ['Work'], '/Volumes/Work': ['legacy-crm+'],
    },
  },
  linux: {
    sep: '/',
    places: [['Home', '/home/you'], ['Projects', '/home/you/projects'], ['Computer', '/'], ['Mounted disks', '/mnt']],
    tree: {
      '/': ['home', 'mnt', 'opt', 'srv'], '/home': ['you'],
      '/home/you': ['projects', 'Documents', 'Downloads'],
      '/home/you/projects': ['shop-app*', 'api-gateway+', 'dotfiles+'],
      '/mnt': ['data'], '/mnt/data': ['ml-experiments+'], '/srv': ['www+'],
    },
  },
};
let pk = { os: 'windows', at: 'C:\\Code' };
const pkJoin = (dir, name) => dir.endsWith(FS[pk.os].sep) ? dir + name : dir + FS[pk.os].sep + name;
function pkCrumbs(path) {
  const sep = FS[pk.os].sep;
  if (pk.os === 'windows') {
    const parts = path.split('\\').filter(Boolean);
    return parts.map((p, i) => [i === 0 ? p + '\\' : p, i === 0 ? p + '\\' : parts.slice(0, i + 1).join('\\')]);
  }
  const parts = path.split('/').filter(Boolean);
  return [['/', '/'], ...parts.map((p, i) => [p, '/' + parts.slice(0, i + 1).join('/')])];
}
function pkRender() {
  const fs = FS[pk.os];
  const kids = (fs.tree[pk.at] || []);
  document.getElementById('pk-places').innerHTML = '<small>Places</small>' + fs.places.map(([label, path]) =>
    `<button data-pk-go="${path}" class="${pk.at === path ? 'on' : ''}">${label}</button>`).join('');
  document.getElementById('pk-path').innerHTML = pkCrumbs(pk.at).map(([label, path], i) =>
    (i ? '<span class="sep">›</span>' : '') + `<button class="crumbbtn" data-pk-go="${path}">${label}</button>`).join('');
  document.getElementById('pk-list').innerHTML = kids.length ? kids.map(k => {
    const done = k.endsWith('*'), git = k.endsWith('+'), name = k.replace(/[*+]$/, '');
    return `<li><button data-pk-go="${pkJoin(pk.at, name)}">${I.folder}${name}${done ? '<span class="tag done">Already a project</span>' : git ? '<span class="tag">Git repository</span>' : ''}</button></li>`;
  }).join('') : '<li class="pk-empty">No folders inside. Choose this folder, or go back.</li>';
  document.getElementById('pk-chosen').textContent = pk.at;
  document.querySelectorAll('[data-pk-os]').forEach(b => b.classList.toggle('on', b.dataset.pkOs === pk.os));
}
document.addEventListener('click', e => {
  if (e.target.closest('[data-browse]')) { e.preventDefault(); pkRender(); document.getElementById('picker').showModal(); }
  const go = e.target.closest('[data-pk-go]');
  if (go) { pk.at = go.dataset.pkGo; pkRender(); }
  const os = e.target.closest('[data-pk-os]');
  if (os) { pk.os = os.dataset.pkOs; pk.at = FS[pk.os].places[0][1]; pkRender(); }
  if (e.target.closest('[data-pk-up]')) {
    const c = pkCrumbs(pk.at); if (c.length > 1) { pk.at = c[c.length - 2][1]; pkRender(); }
  }
  if (e.target.closest('[data-pk-pick]')) {
    const input = document.getElementById('addpath'); if (input) input.value = pk.at;
    document.getElementById('picker').close();
  }
  if (e.target.closest('[data-pk-cancel]')) document.getElementById('picker').close();
});

function render() {
  const r = route();
  sidebar(r);
  const main = document.getElementById('main');
  main.innerHTML = r.p ? (P[r.page] || P.overview)(r.p) : (G[r.page] || G.overview)();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);
render();
</script>
